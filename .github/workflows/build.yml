name: Build and Deploy JESD Eye Scan GTK
permissions:
  contents: read

env:
  APP_NAME: jesd-eye-scan-gtk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
  pull_request:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'

jobs:
  identify_version:
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.set_version.outputs.version }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Set app version
      id: set_version
      run: |
        # Extract version from CMakeLists.txt DEFAULT_PROJECT_VERSION
        cmake_version=$(grep -oP 'set\s*\(\s*DEFAULT_PROJECT_VERSION\s+"\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)

        if [[ -z "$cmake_version" ]]; then
            echo "Failed to extract version from CMakeLists.txt, using default"
            cmake_version="0.0.1+${{ github.sha }}"
        fi

        echo "Version to use: $cmake_version"
        echo "version=$cmake_version" >> "$GITHUB_OUTPUT"

  build_containerized:
    runs-on: ${{matrix.runner}}
    needs: identify_version
    env:
      CONTAINER: ${{matrix.distro}}-${{matrix.architecture}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            docker_image: docker.cloudsmith.io/adi/containers/kuiper_basic_64@sha256:2a4b203ca34cf660339f8d8a5b32d290ae3c4918e18c0473902e2c12c86ca129
            distro: kuiper
            architecture: arm64
            platform_flag: ""
          - runner: ubuntu-24.04-arm
            docker_image: docker.cloudsmith.io/adi/containers/kuiper_basic_32@sha256:ce9c5eba9dc120595e42142665aa11ded7317181c01c14c190e86835cfef9c8a
            distro: kuiper
            architecture: armhf
            platform_flag: "--platform linux/arm/v7"
          - runner: ubuntu-26.04-arm
            docker_image: debian:latest
            distro: debian
            architecture: arm64
            platform_flag: ""
          - runner: ubuntu-26.04-arm
            docker_image: debian:latest
            distro: debian
            architecture: armhf
            platform_flag: "--platform linux/arm/v7"

    steps:
    - name: Checkout code repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        path: ${{env.APP_NAME}}

    - name: Checkout deb-generator-action
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        repository: analogdevicesinc/shared-actions
        ref: 114160b9f6dc3d27707d8acc8d3eee31714c0548 # main
        path: shared-actions

    - name: Start persistent container
      run: |
        docker run -d \
            ${{matrix.platform_flag}} \
            --name $CONTAINER \
            -v "$GITHUB_WORKSPACE/${{env.APP_NAME}}:/workspace/${{env.APP_NAME}}" \
            -v "$GITHUB_WORKSPACE/shared-actions/deb-generator-action:/deb-generator-action" \
            -w /workspace/${{env.APP_NAME}} \
            ${{matrix.docker_image}} tail -f /dev/null

    - name: Install container prerequisites
      run: |
        # build-deb.sh curls the ADI package feed; plain debian images lack curl.
        docker exec $CONTAINER sh -c "apt-get update -qq && apt-get install -y -qq curl ca-certificates"

    - name: Create debian package
      run: |
        docker exec \
            -e VERSION=${{needs.identify_version.outputs.app-version}} \
            -e WORKING_DIRECTORY=/workspace/${{env.APP_NAME}} \
            -e CONTROL_PATH=packaging/debian \
            $CONTAINER \
            bash /deb-generator-action/build-deb.sh

    - name: Install application
      run: |
        docker exec $CONTAINER sh -c "apt-get install -y gnuplot && dpkg -i artifacts/*.deb"

    - name: Verify install locations
      run: |
        docker exec $CONTAINER sh -c ".github/scripts/verify_install.sh"

    - name: Copy debian artifacts from container to host
      run: |
        docker cp $CONTAINER:/workspace/${{env.APP_NAME}}/artifacts/. ./artifacts/
        ls -la ./artifacts/

    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{env.APP_NAME}}-${{matrix.distro}}-${{matrix.architecture}}
        path: |
          artifacts/*.deb
          artifacts/*.dsc
          artifacts/*.debian.tar.xz
          artifacts/*.orig.tar.gz
        if-no-files-found: error

  build_native:
    runs-on: ${{matrix.runner}}
    needs: identify_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            distro: ubuntu-26.04
            architecture: amd64
          - runner: ubuntu-24.04
            distro: ubuntu-24.04
            architecture: amd64
    defaults:
      run:
        working-directory: ${{env.APP_NAME}}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        path: ${{env.APP_NAME}}

    - name: Create .deb package
      id: create_deb
      uses: analogdevicesinc/shared-actions/deb-generator-action@114160b9f6dc3d27707d8acc8d3eee31714c0548 # main
      with:
        version: ${{needs.identify_version.outputs.app-version}}
        working-directory: ${{env.APP_NAME}}

    - name: Install application
      run: |
        sudo apt-get install -y gnuplot
        sudo dpkg -i ${{ steps.create_deb.outputs.artifact-dir }}/*.deb

    - name: Verify install locations
      run: |
        .github/scripts/verify_install.sh

    - name: Copy debian artifacts
      run: |
        mkdir -p artifacts
        cp ${{ steps.create_deb.outputs.artifact-dir }}/*.deb ${{ steps.create_deb.outputs.artifact-dir }}/*.dsc ${{ steps.create_deb.outputs.artifact-dir }}/*.debian.tar.xz ${{ steps.create_deb.outputs.artifact-dir }}/*.orig.tar.gz artifacts/
        ls -la artifacts/

    - name: Upload debian artifacts to github
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{env.APP_NAME}}-${{matrix.distro}}-${{matrix.architecture}}
        path: |
          ${{env.APP_NAME}}/artifacts/*.deb
          ${{env.APP_NAME}}/artifacts/*.dsc
          ${{env.APP_NAME}}/artifacts/*.debian.tar.xz
          ${{env.APP_NAME}}/artifacts/*.orig.tar.gz
        if-no-files-found: error
